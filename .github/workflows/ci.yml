name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.16.0

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Unit and integration tests
        run: cargo test --test integration_sdk

      - name: E2E examples tests
        run: cargo test --test examples_e2e

  # Single required status check for the branch ruleset. Point the ruleset at
  # `ci-required`, not at the individual `test (...)` matrix legs, so the matrix
  # can change without a settings change. `always()` so this job still reports a
  # result when `test` fails or is cancelled: a required check that never
  # reports would block every pull request.
  ci-required:
    name: ci-required
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          set -euo pipefail
          # `needs.test.result` is success only when every matrix leg succeeded.
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::test did not pass (result=$TEST_RESULT)"
            exit 1
          fi
          echo "test passed on all matrix legs"
